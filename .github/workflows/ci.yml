name: Check ExpObserver
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
        node: ['22']
        include:
          - os: ubuntu-latest
            python: '3.10'
            node: '20'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python scripts/package_release.py
      - run: python -m unittest discover -s tests -p test_distribution.py -v
      - run: python -m unittest discover -s tests -p test_bootstrap.py -v
