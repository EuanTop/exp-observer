name: Bug report
description: Report unexpected behavior in ExpObserver.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest example that reproduces the issue.
      placeholder: |
        1. Start ExpObserver with ...
        2. Open or create ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node.js and Python versions, ExpObserver revision or ZIP version, and how you started it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Attach relevant error output, screenshots or a small synthetic record. Remove personal research content and credentials.
