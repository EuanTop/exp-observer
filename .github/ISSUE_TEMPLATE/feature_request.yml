name: Feature request
description: Suggest an improvement to the research workflow.
title: "[Feature] "
body:
  - type: textarea
    id: task
    attributes:
      label: Research task
      description: What are you trying to do, and where does ExpObserver get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the interaction or agent operation you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Include any current workaround and why it falls short.
  - type: textarea
    id: context
    attributes:
      label: Examples or context
      description: Add a small example, mockup or relevant reference.
